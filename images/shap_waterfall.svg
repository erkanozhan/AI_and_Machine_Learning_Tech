<svg width="680" height="390" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="680" height="390" fill="#ffffff" rx="8" stroke="#dde0e3" stroke-width="1.2"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">
    SHAP — Tek Örnek İçin Özellik Katkıları (Force Plot)
  </text>
  <text x="340" y="38" text-anchor="middle" font-size="10" fill="#7f8c8d">
    Örnek #47 · Temel Tahmin E[f(x)] = 850,000 TL → Tahmin f(x) = 1,050,000 TL
  </text>

  <!--
    Zero line at x=240. Scale: 2.5 px per 1,000 TL
    Positive (red/orange): extend RIGHT from x=240
    Negative (blue):       extend LEFT  from x=240

    alan_m2:          +120,000 TL  → width=300px  [240, 540]
    semt_Merkez:       +95,000 TL  → width=237px  [240, 477]
    oda_sayisi:        +15,000 TL  → width=37px   [240, 277]
    bina_yasi:         -25,000 TL  → width=62px   [178, 240]
    isitma_Elektrik:    -5,000 TL  → width=12px   [228, 240]

    Row y positions (bar height=26px):
    Row 0: y=58
    Row 1: y=103
    Row 2: y=148
    Row 3: y=193
    Row 4: y=238
  -->

  <!-- Chart area background -->
  <rect x="195" y="50" width="450" height="228" fill="#fafbfc" rx="4" stroke="#e8eaed" stroke-width="0.8"/>

  <!-- Zero line (vertical) -->
  <line x1="240" y1="50" x2="240" y2="278" stroke="#555" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="240" y="288" text-anchor="middle" font-size="10" fill="#555">0</text>

  <!-- Reference lines at +50k, +100k, -25k -->
  <line x1="365" y1="50" x2="365" y2="278" stroke="#e0e3e6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="365" y="288" text-anchor="middle" font-size="9" fill="#888">+50k</text>
  <line x1="490" y1="50" x2="490" y2="278" stroke="#e0e3e6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="490" y="288" text-anchor="middle" font-size="9" fill="#888">+100k</text>
  <line x1="178" y1="50" x2="178" y2="278" stroke="#e0e3e6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="178" y="288" text-anchor="middle" font-size="9" fill="#888">-25k</text>

  <!-- X-axis label -->
  <text x="380" y="300" text-anchor="middle" font-size="10" fill="#666" font-style="italic">SHAP Değeri (TL — Temel Değerden Sapma)</text>

  <!-- Y-axis line -->
  <line x1="195" y1="50" x2="195" y2="278" stroke="#8e9aaa" stroke-width="1.5"/>

  <!-- ====== ROW 0: alan_m2 +120,000 ====== -->
  <rect x="240" y="60" width="300" height="26" fill="#e74c3c" rx="3" opacity="0.85"/>
  <text x="190" y="77" text-anchor="end" font-size="11" fill="#1a252f" font-weight="600">alan_m2</text>
  <!-- value label at right -->
  <text x="545" y="77" font-size="10.5" fill="#c0392b" font-weight="bold">+120,000 TL</text>

  <!-- ====== ROW 1: semt_Merkez +95,000 ====== -->
  <rect x="240" y="105" width="237" height="26" fill="#e67e22" rx="3" opacity="0.85"/>
  <text x="190" y="122" text-anchor="end" font-size="11" fill="#1a252f" font-weight="600">semt_Merkez</text>
  <text x="482" y="122" font-size="10.5" fill="#d35400" font-weight="bold">+95,000 TL</text>

  <!-- ====== ROW 2: oda_sayisi +15,000 ====== -->
  <rect x="240" y="150" width="37" height="26" fill="#f39c12" rx="3" opacity="0.85"/>
  <text x="190" y="167" text-anchor="end" font-size="11" fill="#1a252f" font-weight="600">oda_sayisi</text>
  <text x="282" y="167" font-size="10.5" fill="#e08e0b" font-weight="bold">+15,000 TL</text>

  <!-- ====== ROW 3: bina_yasi -25,000 ====== -->
  <rect x="178" y="195" width="62" height="26" fill="#2980b9" rx="3" opacity="0.85"/>
  <text x="190" y="212" text-anchor="end" font-size="11" fill="#1a252f" font-weight="600">bina_yasi</text>
  <!-- value label at left -->
  <text x="173" y="212" text-anchor="end" font-size="10.5" fill="#1a5276" font-weight="bold">−25,000 TL</text>

  <!-- ====== ROW 4: isitma_Elektrik -5,000 ====== -->
  <rect x="228" y="240" width="12" height="26" fill="#5dade2" rx="3" opacity="0.85"/>
  <text x="190" y="257" text-anchor="end" font-size="11" fill="#1a252f" font-weight="600">isitma_Elektrik</text>
  <text x="222" y="257" text-anchor="end" font-size="10.5" fill="#1f618d" font-weight="bold">−5,000 TL</text>

  <!-- ====== Legend / Annotation Box ====== -->
  <rect x="30" y="315" width="300" height="60" fill="#fdf2f2" rx="6" stroke="#e74c3c" stroke-width="0.8"/>
  <text x="45" y="333" font-size="11" fill="#c0392b" font-weight="bold">Pozitif Katkı (Tahmini Artırır)</text>
  <rect x="45" y="340" width="14" height="10" fill="#e74c3c" rx="2"/>
  <text x="63" y="349" font-size="10" fill="#444">Kırmızı / Turuncu çubuklar sağa uzanır</text>
  <text x="45" y="365" font-size="10" fill="#888">Özellik, tahmini temel değerin ÜSTÜNE çeker</text>

  <rect x="360" y="315" width="300" height="60" fill="#eaf4fb" rx="6" stroke="#2980b9" stroke-width="0.8"/>
  <text x="375" y="333" font-size="11" fill="#1a5276" font-weight="bold">Negatif Katkı (Tahmini Düşürür)</text>
  <rect x="375" y="340" width="14" height="10" fill="#2980b9" rx="2"/>
  <text x="393" y="349" font-size="10" fill="#444">Mavi çubuklar sola uzanır</text>
  <text x="375" y="365" font-size="10" fill="#888">Özellik, tahmini temel değerin ALTINA çeker</text>
</svg>
