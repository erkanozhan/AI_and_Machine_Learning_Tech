<svg width="800" height="390" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="390" fill="#ffffff" rx="8" stroke="#dde0e3" stroke-width="1.2"/>

  <!-- Main Title -->
  <text x="400" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a252f">
    Feature Importance · SHAP · LIME — Üç Yöntemin Karşılaştırması
  </text>
  <text x="400" y="40" text-anchor="middle" font-size="10" fill="#7f8c8d">
    Kapsam, garanti ve pratik kullanım açısından
  </text>

  <!-- ============ COLUMN 1: Feature Importance ============ -->
  <rect x="14" y="52" width="248" height="310" fill="#eaf4fb" rx="8" stroke="#aed6f1" stroke-width="1.2"/>

  <!-- Header -->
  <rect x="14" y="52" width="248" height="38" fill="#1a5276" rx="8"/>
  <rect x="14" y="74" width="248" height="16" fill="#1a5276"/>
  <text x="138" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Feature Importance</text>
  <text x="138" y="83" text-anchor="middle" font-size="10" fill="#aed6f1">MDI / Permutation</text>

  <!-- Badge: GLOBAL -->
  <rect x="80" y="100" width="116" height="22" fill="#1a5276" rx="11"/>
  <text x="138" y="115" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">KÜRESEL (Global)</text>

  <!-- Mini bar chart -->
  <text x="35" y="145" font-size="9.5" fill="#555">alan_m2</text>
  <rect x="95" y="132" width="130" height="14" fill="#2e86c1" rx="2" opacity="0.85"/>

  <text x="35" y="168" font-size="9.5" fill="#555">semt</text>
  <rect x="95" y="155" width="90" height="14" fill="#3498db" rx="2" opacity="0.85"/>

  <text x="35" y="191" font-size="9.5" fill="#555">bina_yasi</text>
  <rect x="95" y="178" width="60" height="14" fill="#5dade2" rx="2" opacity="0.85"/>

  <text x="95" y="215" font-size="9" fill="#888" font-style="italic">← Tüm veri seti üzerinden</text>

  <!-- Properties -->
  <line x1="24" y1="224" x2="252" y2="224" stroke="#aed6f1" stroke-width="0.8"/>

  <text x="28" y="240" font-size="10" fill="#1a5276">✓</text>
  <text x="40" y="240" font-size="10" fill="#2c3e50">Hızlı (model içinde hazır)</text>

  <text x="28" y="256" font-size="10" fill="#1a5276">✓</text>
  <text x="40" y="256" font-size="10" fill="#2c3e50">Tüm modele genel bakış</text>

  <text x="28" y="272" font-size="10" fill="#c0392b">✗</text>
  <text x="40" y="272" font-size="10" fill="#2c3e50">Yön bilgisi yok (+/−?)</text>

  <text x="28" y="288" font-size="10" fill="#c0392b">✗</text>
  <text x="40" y="288" font-size="10" fill="#2c3e50">Tek örnek açıklaması yok</text>

  <text x="28" y="304" font-size="10" fill="#c0392b">✗</text>
  <text x="40" y="304" font-size="10" fill="#2c3e50">Korelasyona duyarlı</text>

  <rect x="24" y="316" width="232" height="38" fill="#d6eaf8" rx="5"/>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">Ne zaman kullan?</text>
  <text x="140" y="347" text-anchor="middle" font-size="9.5" fill="#1a5276">Model seçimi, değişken seçimi,</text>
  <!-- remove last line since it overflows -->

  <!-- ============ COLUMN 2: SHAP ============ -->
  <rect x="278" y="52" width="248" height="310" fill="#f9ebff" rx="8" stroke="#d7bde2" stroke-width="1.2"/>

