  <rect x="278" y="52" width="248" height="38" fill="#6c3483" rx="8"/>
  <rect x="278" y="74" width="248" height="16" fill="#6c3483"/>
  <text x="402" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SHAP</text>
  <text x="402" y="83" text-anchor="middle" font-size="10" fill="#d7bde2">SHapley Additive exPlanations</text>

  <!-- Badge: LOCAL + GLOBAL -->
  <rect x="318" y="100" width="168" height="22" fill="#6c3483" rx="11"/>
  <text x="402" y="115" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">YEREL + KÜRESEL</text>

